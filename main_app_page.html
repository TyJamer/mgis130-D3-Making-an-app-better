<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusVault | Student Budgeting</title>
  <link rel="stylesheet" href="3_styles/style.css">
</head>
<body>

  <header class="app-header">
    <h1>CampusVault</h1>
    <p class="subtitle">Smart Budgeting for College Students</p>
  </header>

  <main class="container">
    <!-- STEP 1: Sign In or Guest View -->
    <section id="auth-view" class="card">
      <h2>Welcome</h2>
      <p>Track your income, manage expenses, and convert international currencies effortlessly.</p>
      
      <form id="signin-form" class="form-group">
        <label for="student-name">Student Name or Email</label>
        <input type="text" id="student-name" placeholder="e.g., Alex" required>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="divider"><span>or</span></div>

      <button id="guest-btn" type="button" class="btn btn-secondary">Continue as Guest</button>
    </section>

    <!-- STEP 2: Budget Style Selection View (Hidden at first) -->
    <section id="style-view" class="card hidden">
      <div class="view-header">
        <h2>Choose Your Budgeting Style</h2>
        <span id="user-badge" class="badge">Guest</span>
      </div>
      <p>Select a framework below to organize your money:</p>

      <div class="style-grid" id="style-options">
        <button class="style-card" data-style="50-30-20">
          <h3>50 / 30 / 20 Rule</h3>
          <p>50% Needs, 30% Wants, 20% Savings & Debt</p>
        </button>

        <button class="style-card" data-style="60-20-20">
          <h3>60 / 20 / 20 Rule</h3>
          <p>60% Needs, 20% Wants, 20% Savings & Debt</p>
        </button>

        <button class="style-card" data-style="70-20-10">
          <h3>70 / 20 / 10 Rule</h3>
          <p>70% Living Expenses, 20% Savings, 10% Debt/Giving</p>
        </button>

        <button class="style-card" data-style="80-20">
          <h3>80 / 20 Rule</h3>
          <p>80% Expenses & Wants, 20% Straight to Savings</p>
        </button>

        <button class="style-card" data-style="zero-based">
          <h3>Zero-Based Budget</h3>
          <p>Every single dollar is assigned a job until $0 remains</p>
        </button>

        <button class="style-card" data-style="values-based">
          <h3>Values-Based Budget</h3>
          <p>Prioritize spending on what matters most to your goals</p>
        </button>
      </div>

      <p id="selection-status" class="status-message"></p>
    </section>
  </main>

  <!-- Scripts loaded in numbered order -->
  <script src="2_scripts/4_start.js"></script>
</body>
</html>
